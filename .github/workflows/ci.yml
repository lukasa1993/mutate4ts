name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build wheel
        run: python -m build
      - name: Install wheel and tests
        run: python -m pip install dist/*.whl pytest
      - name: Unit and target-parser tests
        run: python -m pytest -q
      - name: CLI smoke tests
        run: |
          mutate4ts --version
          mutate4ts --help
      - name: TypeScript fixture parser smoke
        run: python -c "from pathlib import Path; from tree_sitter_language_pack import get_parser; p=Path('tests/fixtures/sample.ts'); assert not get_parser('typescript').parse(p.read_bytes()).root_node.has_error"
